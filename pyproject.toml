[project]
name = "gcdiagram"
version = "0.1.0"
description = "Chess diagrams from extended FEN using the Good Companion (GC2004) fonts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[dependency-groups]
dev = [
    "fonttools>=4.68.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
extra-paths = ["tools"]
